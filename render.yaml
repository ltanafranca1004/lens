services:
  - type: web
    name: lens-api
    runtime: python
    plan: free
    # Free tier has no pre-deploy command, so run migrations in the build step.
    # A failed migration fails the build, so Render never serves the new version.
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false        # Supabase Session-mode pooler string; set at Blueprint creation
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: USE_MOCK_LLM
        value: "false"
      - key: CORS_ORIGINS
        sync: false        # set to the Vercel URL after the frontend deploys
      - key: PYTHON_VERSION
        value: "3.12.2"
